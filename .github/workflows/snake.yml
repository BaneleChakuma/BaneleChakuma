name: Generate snake animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=e879f9,c026d3,a21caf,86198f&color_dots=161b22,4a044e,86198f,c026d3,f5d0fe
            dist/github-contribution-grid-snake-dark.svg?color_snake=e879f9,c026d3,a21caf,86198f&color_dots=161b22,4a044e,86198f,c026d3,f5d0fe

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
