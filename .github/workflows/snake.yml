name: Generate snake animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=a855f7,7c3aed,6b21a8,4c1d95&color_dots=161b22,3b0764,6b21a8,a855f7,e9d5ff
            dist/github-contribution-grid-snake-dark.svg?color_snake=a855f7,7c3aed,6b21a8,4c1d95&color_dots=161b22,3b0764,6b21a8,a855f7,e9d5ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
